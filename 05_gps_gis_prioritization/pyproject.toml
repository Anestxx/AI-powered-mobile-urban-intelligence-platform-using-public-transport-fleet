[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "codyssey-location-intelligence"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic demo GPS and issue matching for CODYSSEY"

[tool.setuptools.packages.find]
include = ["location_intelligence*"]
